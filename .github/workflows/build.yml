name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Started by release.yml for the post-release pull request, whose push starts no workflow by itself
  workflow_dispatch:
  # release.yml builds, tests and packs the release commit with this workflow, then publishes its packages
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string

permissions:
  contents: read

# A new push to a pull request cancels the build still running for its previous push, whose result no longer
# matters. Every other run, including pushes to main, release builds and builds started by hand, has a group of its
# own, so it's never cancelled or held back by another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('build-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A run takes about 10 minutes, and has taken up to 18. Without a limit, a hang would hold the runner for six hours
    timeout-minutes: 45

    steps:
      # The release commit when release.yml calls this, otherwise the commit of the event
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The .NET 11 SDK (from global.json) builds both targets; the .NET 10 runtime runs the net10.0 tests
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # Downloaded NuGet packages, kept between runs, so restores are faster and depend less on nuget.org. Not for a
      # release build, which release.yml starts with a ref: it restores everything from nuget.org, so nothing cached
      # can reach the packages it publishes.
      - name: Cache NuGet packages
        if: inputs.ref == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config', 'dotnet-tools.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Integration tests are skipped unless their LATIPRIMERE_TEST_* variable is set (see CONTRIBUTING.md). Each
      # runner sets the variables for the virtual printers it has; once set, a test that can't reach them fails.

      # Ubuntu: the CUPS test container's image, built with its layers kept in GitHub's cache, so its Debian packages
      # are downloaded only when the Dockerfile changes, rather than twice in every run. The mDNS job shares the cache.
      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test container
        if: runner.os == 'Linux'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: tools/virtual-printers
          tags: latiprimere-virtual-printers
          load: true
          cache-from: type=gha,scope=virtual-printers
          cache-to: type=gha,scope=virtual-printers,mode=max

      # Ubuntu: the CUPS test container, with its five queues and ippeveprinter. Addresses are 127.0.0.1, not
      # localhost, because the container publishes on IPv4 only.
      - name: Start virtual printers
        if: runner.os == 'Linux'
        env:
          LATIPRIMERE_TEST_CUPS_OUTPUT: ${{ runner.temp }}/cups-output
        run: |
          mkdir -p "$LATIPRIMERE_TEST_CUPS_OUTPUT"
          docker compose -f tools/virtual-printers/compose.yaml up -d --no-build --wait
          {
            echo "LATIPRIMERE_TEST_CUPS_SERVER=127.0.0.1:631"
            echo "LATIPRIMERE_TEST_CUPS_OUTPUT=$LATIPRIMERE_TEST_CUPS_OUTPUT"
            echo "LATIPRIMERE_TEST_IPP_PRINTER=ipp://127.0.0.1:8631/ipp/print"
          } >> "$GITHUB_ENV"

      # macOS: no Docker on these runners, so the runner's own CUPS gets the container's Raw, Paused and Virtual-IPP
      # queues, and ippeveprinter on 8631. Raw sends its jobs to a capture server, since Apple's CUPS can't take an
      # extra backend. The tests of CUPS-PDF and Secure, which only the container has, skip. The tests reach CUPS
      # through its socket, as Mac applications do: cupsd exits after a minute with nothing to do, and launchd starts
      # it again for the socket but not for 127.0.0.1:631, which a build can easily outlast.
      - name: Set up macOS test printers
        if: runner.os == 'macOS'
        run: |
          output_directory=/Users/Shared/LatiprimereTestOutput
          sh tools/macos-test-printers/install-test-printers.sh "$output_directory"
          {
            echo "LATIPRIMERE_TEST_CUPS_SERVER=/private/var/run/cupsd"
            echo "LATIPRIMERE_TEST_CUPS_OUTPUT=$output_directory"
            echo "LATIPRIMERE_TEST_CUPS_SETUP=macos"
            echo "LATIPRIMERE_TEST_IPP_PRINTER=ipp://127.0.0.1:8631/ipp/print"
          } >> "$GITHUB_ENV"

      # Windows: the spooler test printers (Generic / Text Only on file ports, and a paused queue). The runner is
      # elevated, which the script needs. Microsoft Print to PDF tests run too where the image has that printer.
      - name: Install Windows test printers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Service -Name Spooler
          $outputDirectory = Join-Path $env:ProgramData 'Latiprimere\TestOutput'
          ./tools/windows-test-printers/Install-TestPrinters.ps1 -OutputDirectory $outputDirectory
          "LATIPRIMERE_TEST_WINDOWS_OUTPUT=$outputDirectory" >> $env:GITHUB_ENV
          Get-Printer | Format-Table Name, DriverName, PortName, KeepPrintedJobs -AutoSize

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # A limit on the whole test run, so a hung test fails the step rather than the job's time limit. Each test
      # project writes HTML and JUnit reports, kept below if the job fails, so a failing test can be named. The
      # slowest tests are listed in the log, to show where the time goes.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --timeout 30m
          --results-directory "${{ github.workspace }}/artifacts/test-results"
          --results-directory-layout per-module
          --report-xunit-html
          --report-xunit-junit
          --show-slowest-tests 10

      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          retention-days: 7
          if-no-files-found: ignore

      # The API reference in docs/site/reference is generated from the public types and their documentation
      # comments by tools/api-reference. It's committed, so each release tag carries the reference for its own API,
      # which the website reads; this fails when the committed pages no longer match the code.
      - name: Check the API reference
        if: runner.os == 'Linux'
        run: |
          dotnet run --project tools/api-reference --no-build --configuration Release
          if [ -n "$(git status --porcelain -- docs/site/reference)" ]; then
            git status --short -- docs/site/reference
            git diff --stat -- docs/site/reference
            echo "::error::docs/site/reference doesn't match the code. Run 'dotnet run --project tools/api-reference' and commit the pages."
            exit 1
          fi

      # The release scripts run only when a release is made, and switch-to-stable.sh only once, at 1.0, so they're
      # checked on every push: ShellCheck, which the Ubuntu runner has, then the stable switch and the README status
      # check run on scratch copies with LF and CRLF line endings (tools/releasing/test-release-scripts.sh)
      - name: Check the release scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck tools/releasing/*.sh
          sh tools/releasing/test-release-scripts.sh

      # Native AOT needs the platform's linker: the runners have Visual Studio's C++ tools and Xcode, and Linux needs
      # clang and zlib
      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Publishes the CLI sample and the end-to-end harness with Native AOT for each target, fails on any trimming or
      # AOT warning, and runs some of the native harness's scenarios against this runner's test printers: listing,
      # options through CUPS and straight to ippeveprinter, Microsoft Print to PDF, and the scripted printer for raster,
      # vendor options, remembered addresses, a stalled upload, job reasons, a Windows queue over IPPS, spooler
      # notifications, the typed options and password-protected PDFs (tools/aot-check/check-aot.sh lists them; ADR
      # 0029). A scenario whose printers the runner doesn't have is skipped.
      - name: Check Native AOT
        shell: bash
        run: |
          bash tools/aot-check/check-aot.sh net10.0
          bash tools/aot-check/check-aot.sh net11.0

      # Packs on one runner, so every change shows that the packages still build and pass package validation. The
      # packages are kept for a few days to inspect. When release.yml calls this, these are the ones it publishes.
      # Each package carries its CycloneDX SBOM, at sbom/<package>.cdx.json (tools/releasing/generate-sboms.sh, ADR
      # 0051), and the step fails if one doesn't.
      - name: Pack
        if: runner.os == 'Linux'
        run: |
          dotnet tool restore
          sh tools/releasing/generate-sboms.sh artifacts/sbom
          dotnet pack --no-build --configuration Release --output artifacts/packages -p:SbomDirectory="$PWD/artifacts/sbom"
          for package in artifacts/packages/*.nupkg; do
            id=$(unzip -p "$package" '*.nuspec' | sed -n 's|.*<id>\(.*\)</id>.*|\1|p')
            if ! unzip -l "$package" "sbom/$id.cdx.json" > /dev/null; then
              echo "::error::$package has no SBOM at sbom/$id.cdx.json."
              exit 1
            fi
          done

      - name: Keep packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
          retention-days: 7

      - name: Keep SBOMs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom
          retention-days: 7

      - name: Show virtual printer logs
        if: failure() && runner.os == 'Linux'
        run: |
          docker logs latiprimere-cups
          docker exec latiprimere-cups tail -n 200 /var/log/cups/error_log

      - name: Show macOS test printer logs
        if: failure() && runner.os == 'macOS'
        run: |
          lpstat -t || true
          ls -l /Users/Shared/LatiprimereTestOutput || true
          cat /tmp/latiprimere-test-printers/capture-server.log || true
          cat /tmp/latiprimere-test-printers/ippeveprinter.log || true
          sudo tail -n 300 /var/log/cups/error_log || true

  # ADR 0029, decision 6: the end-to-end harness's mDNS discovery scenario. The test container runs on the runner's own
  # network, so the Avahi announcement of its ippeveprinter reaches the harness. On trial from 2026-11-17, when it
  # couldn't fail the build; it passed in every run from then to 2026-11-19, so now it can. The rest of the harness
  # doesn't run in CI (decision 4).
  mdns:
    name: mDNS discovery (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        if: inputs.ref == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config', 'dotnet-tools.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The same image as the build job's, from the same cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: tools/virtual-printers
          tags: latiprimere-virtual-printers
          load: true
          cache-from: type=gha,scope=virtual-printers
          cache-to: type=gha,scope=virtual-printers,mode=max

      - name: Start the test container on the host network
        run: docker compose -f tools/virtual-printers/compose.yaml -f tools/virtual-printers/compose.host-network.yaml up -d --no-build --wait

      - name: Find the virtual printer over mDNS
        env:
          LATIPRIMERE_TEST_MDNS_NAME: Virtual IPP Printer
        run: dotnet run --project tests/Latiprimere.TestHarness --framework net10.0 -- run ipp.discovery.mdns

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdns-report
          path: out/harness
          retention-days: 7

      - name: Show the test container's logs
        if: failure()
        run: docker logs latiprimere-cups
