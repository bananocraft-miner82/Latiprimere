name: Release

# Publishes a release to nuget.org whenever a pull request is merged into the release branch. See docs/releasing.md.
#
#  0. check: stops here, publishing nothing, if the merged commit's files are exactly the latest release's, as when
#     only a post-release pull request's commit is merged into release (tools/releasing/anything-to-release.sh).
#  1. prepare: the version is <.NET major>.0.<one more than the latest release's build number>, ending in -preview
#     while the repository variable RELEASE_PREVIEW isn't false (tools/releasing/next-version.sh, ADR 0030). The
#     release commit sets it, marks the public API shipped and dates the changelog's notes
#     (tools/releasing/prepare-release.sh), and is pushed to post-release/v<version>.
#  2. build: build.yml builds, tests and packs that commit on all three runners.
#  3. publish: pushes those packages to nuget.org, in the "release" environment, which can require an approval.
#     nuget.org's trusted publishing policy names this workflow file and that environment.
#  4. finish: tags the release commit v<version>, adds a commit after it that has main compare its packages with this
#     release (tools/releasing/post-release.sh), and opens a pull request that brings both into main.
on:
  push:
    branches: [release]

permissions:
  contents: read

# One release at a time, each to the end: a second merge waits for the first to finish
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check there's something to release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      release: ${{ steps.check.outputs.release }}

    steps:
      # All history and tags, to find the latest release
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare with the latest release
        id: check
        run: |
          release=$(sh tools/releasing/anything-to-release.sh)
          echo "release=$release" >> "$GITHUB_OUTPUT"

          if [ "$release" = false ]; then
            echo "Nothing to release: this commit has the same files as the latest release." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The later jobs need this one, so they're skipped with it
  prepare:
    name: Prepare the release commit
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # Push the post-release branch

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      # All history and tags, so the scripts can number the release after the latest one and refuse a version
      # already tagged
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Releases are previews, such as 11.0.42-preview, until the repository variable RELEASE_PREVIEW is set to
      # false (Settings → Secrets and variables → Actions → Variables). Unset counts as true, so nothing is
      # released as stable by accident.
      - name: Choose the version
        id: version
        env:
          PREVIEW: ${{ vars.RELEASE_PREVIEW || 'true' }}
        run: |
          case "$PREVIEW" in
            true) preview=--preview ;;
            false) preview= ;;
            *)
              echo "The variable RELEASE_PREVIEW must be true or false, not '$PREVIEW'." >&2
              exit 1
              ;;
          esac

          version=$(sh tools/releasing/next-version.sh $preview)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the release commit
        run: sh tools/releasing/prepare-release.sh "${{ steps.version.outputs.version }}"

      # A re-run of the whole workflow makes the commit again, so the branch is replaced rather than added to
      - name: Commit and push
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props src/Directory.Build.props README.md CHANGELOG.md src/*/PublicAPI.Shipped.txt src/*/PublicAPI.Unshipped.txt
          git commit --message "Release $VERSION" --message "Made by the Release workflow (tools/releasing/prepare-release.sh)."
          git push --force origin "HEAD:refs/heads/post-release/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish to nuget.org
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Counted from when the job starts, so not including any wait for the environment's approval
    timeout-minutes: 20

    # The "release" environment can require an approval before anything is pushed
    environment: release

    permissions:
      contents: read
      id-token: write # Lets NuGet/login exchange GitHub's token for a short-lived nuget.org API key

    steps:
      # Only for dotnet nuget push, so any current SDK does; there's no checkout, so no global.json
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The packages build.yml made and tested on this run
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Check the packages have the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -l artifacts/packages
          if [ ! -f "artifacts/packages/Latiprimere.$VERSION.nupkg" ]; then
            echo "The packages aren't version $VERSION." >&2
            exit 1
          fi

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing each .nupkg also pushes the .snupkg beside it. --skip-duplicate lets a failed run be re-run.
      - name: Push
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  finish:
    name: Tag and open the post-release pull request
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    # Up to 30 minutes of it waiting for nuget.org
    timeout-minutes: 45

    permissions:
      contents: write      # Push the tag
      pull-requests: write # Open the pull request
      actions: write       # Start build.yml on its branch (see below)

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      BRANCH: post-release/v${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # The website shows the docs of the newest tag. The tag is the commit the packages were built from. Pushing it
      # again on a re-run is harmless; pushing it for another commit fails, as it should.
      - name: Tag the release
        run: |
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"

      # nuget.org takes minutes to index the packages just pushed. Once post-release.sh has run, main's package
      # validation compares with this release, so the post-release build's restore fails on every runner until
      # nuget.org serves it. Waiting here, up to 30 minutes, means that build needn't be re-run by hand.
      - name: Wait for nuget.org to serve the packages
        run: sh tools/releasing/wait-for-packages.sh "$VERSION" 1800

      # The release commit compared the packages with the release before this one, as packing it had to. main compares
      # them with this one from now on, so a change to something it first shipped fails on main rather than at the next
      # release; and the suppressions for this release's breaking changes go, as package validation fails on one it
      # doesn't need (ADR 0040). A second commit on the branch, after the tagged one; skipped once the pull request
      # is open, as on a re-run.
      - name: Compare main with this release
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "The pull request for $BRANCH is already open."
            exit 0
          fi

          sh tools/releasing/post-release.sh "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Directory.Build.props
          # A pathspec that matches no file would fail, so only the files the script removed are named
          git ls-files --deleted -- 'src/*/CompatibilitySuppressions.xml' | xargs -r git rm --quiet --cached --

          if git diff --cached --quiet; then
            echo "main already compares with $VERSION."
            exit 0
          fi

          git commit --message "Compare with $VERSION" --message "Made by the Release workflow (tools/releasing/post-release.sh)."
          git push --force origin "HEAD:refs/heads/$BRANCH"

      # The release commit dated the changelog's notes and marked the public API shipped; main needs both. A re-run
      # finds the pull request already open.
      - name: Open the post-release pull request
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "The pull request for $BRANCH is already open."
            exit 0
          fi

          cat > "$RUNNER_TEMP/body.md" <<EOF
          Version $VERSION is on nuget.org. This brings the release commit (tagged \`v$VERSION\`) into \`main\`:

          - the version in \`Directory.Build.props\`;
          - the public API marked shipped;
          - the README status line and the changelog's notes dated as $VERSION.

          And, in a second commit, has \`main\` compare its packages with $VERSION, removing the compatibility suppressions it needed.

          Merge it before the next release, so its changelog notes start from a clean \`## Unreleased\`.
          EOF

          gh pr create --base main --head "$BRANCH" --title "Post-release $VERSION" --body-file "$RUNNER_TEMP/body.md"

          # A push made with the workflow's own token starts no workflows, so the pull request would get no build.
          # Starting build.yml by hand is allowed, and its checks show on the pull request.
          gh workflow run build.yml --ref "$BRANCH"
