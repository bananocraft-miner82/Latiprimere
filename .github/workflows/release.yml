name: Release

# Publishes the packages to nuget.org when a version tag such as v0.1.0-preview is pushed. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest

    # The "release" environment can require an approval before anything is pushed. nuget.org's trusted publishing
    # policy names this workflow file and environment.
    environment: release

    permissions:
      contents: read
      id-token: write # Lets NuGet/login exchange GitHub's token for a short-lived nuget.org API key

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # The tag must name the version the packages get from Directory.Build.props, so a typo can't publish a
      # version nobody meant to
      - name: Check the tag matches the version
        run: |
          version=$(dotnet msbuild src/Latiprimere/Latiprimere.csproj -getProperty:PackageVersion)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the package version $version in Directory.Build.props." >&2
            exit 1
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit tests only: no virtual printers here, so the integration tests skip. build.yml ran them on the commit.
      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts/packages

      - name: Keep packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing each .nupkg also pushes the .snupkg beside it. --skip-duplicate lets a failed run be re-run.
      - name: Push
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
