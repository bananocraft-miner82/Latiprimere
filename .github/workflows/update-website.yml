name: Update website

# Rebuilds latiprimere.com after each release, once its packages are published. The website reads the docs from the
# newest release tag, and shows only released versions from CHANGELOG.md, both when it is built, so a release is the
# only change here that alters the live site. Merges to main don't: their docs and Unreleased notes aren't shown.
# The one exception is the release's post-release pull request, which brings its dated notes into main, so the site
# is rebuilt again when that is merged.
# Run it by hand from the Actions tab after correcting the notes of a version already released.
# It calls a Workers Builds deploy hook for the website's production branch; see docs/releasing.md for the setup.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer run replaces one still waiting: each build reads the latest state anyway
concurrency:
  group: update-website
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild latiprimere.com
    runs-on: ubuntu-latest

    # After a release, only once the packages were published; of closed pull requests, only a merged post-release one
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'post-release/')))

    steps:
      - name: Start a build of the website
        env:
          DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::The WEBSITE_DEPLOY_HOOK secret isn't set, so the website wasn't rebuilt. See docs/releasing.md."
            exit 0
          fi

          # The hook's URL is the credential, so it is never printed; Cloudflare's answer names the build it started
          curl --fail-with-body --silent --show-error --max-time 30 --retry 3 --request POST "$DEPLOY_HOOK"
